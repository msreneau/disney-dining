<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d47a1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Disney Dining & Snack Finder</title><style>:root{--blue:#0d47a1;--blue2:#1976d2;--bg:#f4f7fb;--text:#263238;--muted:#607d8b;--gold:#ffb300}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;text-align:center;padding:calc(18px + env(safe-area-inset-top)) 15px 18px}h1{font-size:24px;margin:0 0 5px}.wrap{max-width:850px;margin:auto;padding:14px}.views{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.view{border:1px solid #bbdefb;background:#fff;color:var(--blue);padding:11px 4px;border-radius:10px;font-weight:800}.view.on{background:var(--blue);color:#fff}.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}select,.check{background:#fff;border:1px solid #dbe4ec;border-radius:10px;padding:11px;font-size:15px}.check{display:flex;align-items:center;gap:6px;white-space:nowrap}.summary,.meta,.notes{color:var(--muted);font-size:14px}.summary{margin:10px 2px}.card{background:#fff;border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 3px 11px #0d47a117}.top{display:flex;justify-content:space-between;gap:10px}.name{font-size:19px;font-weight:800}.item{font-size:17px;color:#6a1b9a;font-weight:750;margin-top:4px}.stars{color:var(--gold);font-size:18px;white-space:nowrap}.pill{display:inline-block;background:#e3f2fd;color:var(--blue);padding:4px 8px;border-radius:99px;font-size:12px;font-weight:800;margin:7px 4px 0 0}.wish{background:#fff3e0;color:#e65100}.notes{margin-top:9px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.actions a{flex:1;min-width:95px;text-align:center;text-decoration:none;background:var(--blue2);color:#fff;padding:10px 7px;border-radius:9px;font-size:13px;font-weight:800}.actions .map{background:#455a64}.empty{background:#fff;border-radius:14px;text-align:center;padding:28px;color:var(--muted)}.error{background:#ffebee;color:#b71c1c;border-radius:12px;padding:14px}@media(max-width:560px){.views{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.check{grid-column:1/-1}}</style></head><body><header><h1 id="title">🏰 Disney Dining & Snack Finder</h1><div>Family-approved meals, coffee and must-try snacks</div></header><main class="wrap"><div class="views"><button class="view" data-view="QS">QS</button><button class="view" data-view="SNACK">SNACK</button><button class="view on" data-view="BOTH">BOTH</button><button class="view" data-view="WISHLIST">⭐ WISHLIST</button></div><div class="filters"><select id="park"><option value="">All Parks</option></select><select id="land"><option value="">All Lands</option></select><label class="check"><input id="allRatings" type="checkbox"> Show all ratings</label></div><div class="summary" id="summary">Loading dining data…</div><div id="results"></div></main><script>let locations=[],settings={minimumRating:3,defaultView:'BOTH',title:'Disney Dining & Snack Finder'},view='BOTH';const $=id=>document.getElementById(id);const yes=v=>['yes','true','1','y'].includes(String(v??'').trim().toLowerCase());const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function start(){try{const res=await fetch('restaurants.json?v='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('restaurants.json could not be loaded');const payload=await res.json();locations=payload.locations||[];settings={...settings,...(payload.settings||{})};view=String(settings.defaultView||'BOTH').toUpperCase();$('title').textContent='🏰 '+settings.title;document.title=settings.title;document.querySelectorAll('.view').forEach(b=>b.classList.toggle('on',b.dataset.view===view));fillParks();render()}catch(e){$('summary').textContent='';$('results').innerHTML='<div class="error"><strong>Unable to load dining data.</strong><br>Confirm index.html and restaurants.json are both in the repository root.</div>'}}function fillParks(){let keep=$('park').value;$('park').innerHTML='<option value="">All Parks</option>';[...new Set(locations.filter(r=>yes(r.Active)).map(r=>r.Park).filter(Boolean))].sort().forEach(x=>$('park').add(new Option(x,x)));if([...$('park').options].some(o=>o.value===keep))$('park').value=keep;fillLands()}function fillLands(){let p=$('park').value,keep=$('land').value;$('land').innerHTML='<option value="">All Lands</option>';[...new Set(locations.filter(r=>yes(r.Active)&&(!p||r.Park===p)).map(r=>r.Land).filter(Boolean))].sort().forEach(x=>$('land').add(new Option(x,x)));if([...$('land').options].some(o=>o.value===keep))$('land').value=keep}function render(){let p=$('park').value,l=$('land').value,min=$('allRatings').checked?0:Number(settings.minimumRating||3);let list=locations.filter(r=>yes(r.Active)&&(!p||r.Park===p)&&(!l||r.Land===l)&&(Number(r.Rating)||0)>=min&&(view==='BOTH'||(view==='WISHLIST'?yes(r.Wishlist):String(r.Type).toUpperCase()===view))).sort((a,b)=>(Number(b.Rating)||0)-(Number(a.Rating)||0)||String(a.Land).localeCompare(String(b.Land))||String(a.Location).localeCompare(String(b.Location)));$('summary').textContent=`${list.length} item${list.length===1?'':'s'} shown · minimum rating ${min||'off'}`;$('results').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No items match these filters.</div>'}function card(r){let n=Math.max(0,Math.min(5,Number(r.Rating)||0)),links=[];if(r.MenuURL)links.push(`<a target="_blank" rel="noopener" href="${esc(r.MenuURL)}">🍔 Menu</a>`);if(r.MobileOrderURL)links.push(`<a target="_blank" rel="noopener" href="${esc(r.MobileOrderURL)}">📱 Mobile Order</a>`);if(r.MapURL)links.push(`<a class="map" target="_blank" rel="noopener" href="${esc(r.MapURL)}">🗺️ Map</a>`);return `<article class="card"><div class="top"><div><div class="name">${esc(r.Location)}</div>${r.Item?`<div class="item">${esc(r.Item)}</div>`:''}<div class="meta">${esc(r.Park)} · ${esc(r.Land)}</div><span class="pill">${esc(r.Type)}</span>${yes(r.Wishlist)?'<span class="pill wish">⭐ Wishlist</span>':''}</div><div class="stars" aria-label="${n} out of 5">${'★'.repeat(n)}${'☆'.repeat(5-n)}</div></div>${r.Notes?`<div class="notes">${esc(r.Notes)}</div>`:''}<div class="actions">${links.join('')}</div></article>`}document.querySelectorAll('.view').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x===b));render()});$('park').onchange=()=>{fillLands();render()};$('land').onchange=render;$('allRatings').onchange=render;start();</script></body></html>
