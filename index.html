<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d47a1"><title>Disney Dining & Snack Finder</title><style>:root{--b:#0d47a1;--b2:#1976d2;--bg:#f4f7fb;--t:#263238;--m:#607d8b;--g:#ffb300}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;text-align:center;padding:22px 14px}h1{font-size:24px;margin:0 0 4px}.wrap{max-width:900px;margin:auto;padding:14px}.views{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.view{border:1px solid #bbdefb;background:#fff;color:var(--b);padding:11px 4px;border-radius:10px;font-weight:800}.view.on{background:var(--b);color:#fff}.panel{background:#fff;border-radius:12px;padding:12px;margin-top:10px;box-shadow:0 2px 9px #0001}.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}select,.check{background:#fff;border:1px solid #dbe4ec;border-radius:9px;padding:10px;font-size:15px}.people{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.person{display:flex;align-items:center;gap:5px;background:#edf4ff;border-radius:99px;padding:7px 10px;font-weight:700}.match{display:flex;gap:15px;margin-top:10px;font-size:14px}.summary,.meta,.notes,.family{color:var(--m);font-size:14px}.summary{margin:10px 2px}.card{background:#fff;border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 3px 11px #0d47a117}.top{display:flex;justify-content:space-between;gap:10px}.name{font-size:19px;font-weight:800}.item{font-size:17px;color:#6a1b9a;font-weight:750}.stars{color:var(--g);font-size:18px;white-space:nowrap}.pill{display:inline-block;background:#e3f2fd;color:var(--b);padding:4px 8px;border-radius:99px;font-size:12px;font-weight:800;margin:7px 4px 0 0}.wish{background:#fff3e0;color:#e65100}.family{margin-top:10px;padding:9px;background:#f7f9fc;border-radius:9px}.family strong{color:#37474f}.personchip{display:inline-block;background:#e8f5e9;color:#2e7d32;border-radius:99px;padding:3px 7px;margin:4px 3px 0 0;font-size:12px;font-weight:800}.notes{margin-top:8px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions a{flex:1;min-width:95px;text-align:center;text-decoration:none;background:var(--b2);color:#fff;padding:10px;border-radius:9px;font-size:13px;font-weight:800}.actions .map{background:#455a64}.empty,.error{background:#fff;border-radius:12px;padding:28px;text-align:center;color:var(--m)}.error{color:#b71c1c;background:#ffebee}@media(max-width:600px){.views{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.check{grid-column:1/-1}}</style></head><body><header><h1 id="title">🏰 Disney Dining & Snack Finder</h1><div>Find the best match for your group</div></header><main class="wrap"><div class="views"><button class="view" data-view="QS">QS</button><button class="view" data-view="SNACK">SNACK</button><button class="view on" data-view="BOTH">BOTH</button><button class="view" data-view="WISHLIST">⭐ WISHLIST</button></div><section class="panel"><div class="filters"><select id="park"><option value="">All Parks</option></select><select id="land"><option value="">All Lands</option></select><label class="check"><input id="allRatings" type="checkbox"> Show all ratings</label></div><div class="people" id="people"></div><div class="match"><strong>People match:</strong><label><input type="radio" name="match" value="ANY" checked> Any selected</label><label><input type="radio" name="match" value="ALL"> Everyone selected</label></div></section><div class="summary" id="summary">Loading…</div><div id="results"></div></main><script>const MEMBERS=['Mike','Tammy','Piper','Fred','Stacy','Evelyn'];let payload,view='BOTH';const $=x=>document.getElementById(x),yes=v=>v===true||['yes','true','1','y'].includes(String(v??'').toLowerCase()),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function likes(r,n){return yes(r.People?.[n]??r[n])}async function load(){try{payload=await(await fetch('restaurants.json?v='+Date.now(),{cache:'no-store'})).json();view=String(payload.settings?.defaultView||'BOTH').toUpperCase();$('title').textContent='🏰 '+(payload.settings?.title||'Disney Dining & Snack Finder');$('people').innerHTML=MEMBERS.map(n=>`<label class="person"><input type="checkbox" value="${n}"> ${n}</label>`).join('');document.querySelectorAll('#people input').forEach(x=>x.onchange=render);fillParks();render()}catch(e){$('summary').textContent='';$('results').innerHTML='<div class="error">Unable to load restaurants.json.</div>'}}function selected(){return [...document.querySelectorAll('#people input:checked')].map(x=>x.value)}function mode(){return document.querySelector('input[name=match]:checked').value}function fillParks(){[...new Set(payload.locations.map(r=>r.Park))].sort().forEach(x=>$('park').add(new Option(x,x)));fillLands()}function fillLands(){let p=$('park').value,keep=$('land').value;$('land').innerHTML='<option value="">All Lands</option>';[...new Set(payload.locations.filter(r=>!p||r.Park===p).map(r=>r.Land))].sort().forEach(x=>$('land').add(new Option(x,x)));if([...$('land').options].some(o=>o.value===keep))$('land').value=keep}function render(){let p=$('park').value,l=$('land').value,min=$('allRatings').checked?0:Number(payload.settings?.minimumRating||3),sel=selected(),m=mode();let a=payload.locations.filter(r=>yes(r.Active)&&(!p||r.Park===p)&&(!l||r.Land===l)&&(Number(r.Rating)||0)>=min&&(view==='BOTH'||(view==='WISHLIST'?yes(r.Wishlist):r.Type===view))&&(!sel.length||(m==='ALL'?sel.every(n=>likes(r,n)):sel.some(n=>likes(r,n)))));a.sort((x,y)=>{let xm=sel.filter(n=>likes(x,n)).length,ym=sel.filter(n=>likes(y,n)).length;return ym-xm||(Number(y.Rating)||0)-(Number(x.Rating)||0)||String(x.Location).localeCompare(String(y.Location))});$('summary').textContent=`${a.length} results${sel.length?` · ${m==='ALL'?'everyone':'anyone'} among ${sel.join(', ')}`:''}`;$('results').innerHTML=a.length?a.map(r=>card(r,sel)).join(''):'<div class="empty">No locations match these choices.</div>'}function card(r,sel){let n=Number(r.Rating)||0,liked=MEMBERS.filter(x=>likes(r,x)),selectedLikes=sel.filter(x=>likes(r,x)),links=[];if(r.MenuURL)links.push(`<a target="_blank" href="${esc(r.MenuURL)}">🍔 Menu</a>`);if(r.MobileOrderURL)links.push(`<a target="_blank" href="${esc(r.MobileOrderURL)}">📱 Mobile Order</a>`);if(r.MapURL)links.push(`<a class="map" target="_blank" href="${esc(r.MapURL)}">🗺️ Map</a>`);return `<article class="card"><div class="top"><div><div class="name">${esc(r.Location)}</div>${r.Item?`<div class="item">${esc(r.Item)}</div>`:''}<div class="meta">${esc(r.Park)} · ${esc(r.Land)}</div><span class="pill">${esc(r.Type)}</span>${yes(r.Wishlist)?'<span class="pill wish">⭐ Wishlist</span>':''}</div><div class="stars">${'★'.repeat(n)}${'☆'.repeat(5-n)}</div></div><div class="family"><strong>${liked.length} of ${MEMBERS.length} family members want this</strong>${sel.length?` · ${selectedLikes.length} of ${sel.length} selected`:''}<br>${liked.length?liked.map(x=>`<span class="personchip">✓ ${x}</span>`).join(''):'<span>No family selections yet</span>'}</div>${r.Notes?`<div class="notes">${esc(r.Notes)}</div>`:''}<div class="actions">${links.join('')}</div></article>`}document.querySelectorAll('.view').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x===b));render()});$('park').onchange=()=>{fillLands();render()};$('land').onchange=render;$('allRatings').onchange=render;document.querySelectorAll('input[name=match]').forEach(x=>x.onchange=render);load();</script></body></html>
