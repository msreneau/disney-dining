<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trip Companion</title><style>:root{--navy:#17233c;--pink:#e83e8c;--blue:#178bc4;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;font:16px Arial;background:var(--bg);color:#17233c}header{background:linear-gradient(135deg,#17233c,#405781);color:#fff;padding:20px}.wrap{max-width:1100px;margin:auto;padding:14px}.panel,.card{background:#fff;padding:14px;border-radius:14px;margin:10px 0;box-shadow:0 3px 12px #0001}.grid,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}button,input,select{padding:10px;border:1px solid #ccd3df;border-radius:9px;font:inherit}button{background:#fff;cursor:pointer}.active{background:var(--navy);color:#fff}.pink{border-color:var(--pink)}.sky{border-color:var(--blue)}.tag{display:inline-block;background:#ecf0f6;border-radius:12px;padding:4px 8px;margin:2px;font-size:13px}.muted{color:#657087}.hide{display:none!important}.people label{display:inline-block;margin:7px}.stars{color:#efa500}.stat{font-size:24px;font-weight:bold;color:#168257}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}</style></head><body><header><div class="wrap"><h1>🏰 <span id="title">Trip Companion</span></h1><div>Dining, snacks, favorites and trip tools</div></div></header><main class="wrap">
<section class="panel"><h2>📍 Current Location</h2><div class="grid"><select id="place"></select><select id="area"></select><button id="remember">Remember Location</button></div></section>
<section class="panel"><h2>Quick Modes</h2><div class="grid"><button class="mode" data-mode="nearby">📍 Nearby</button><button id="pink" class="mode pink" data-mode="pink">🍩 Pink Donut</button><button id="sky" class="mode sky" data-mode="sky">🚡 Skyliner Snacks</button><button id="signature" class="mode" data-mode="signature">🍪 Signature Snacks</button><button id="wishlist" class="mode" data-mode="wishlist">⭐ Wishlist</button><button class="mode" data-mode="resort">🏨 Resorts</button><button class="mode" data-mode="all">Show All</button></div></section>
<section id="family" class="panel"><h2>Family Favorites</h2><div id="people" class="people"></div><select id="match"><option value="any">Any selected person</option><option value="all">Everyone selected</option></select></section>
<section class="panel"><h2>Filters</h2><div class="grid"><select id="type"><option value="">All Types</option><option>QS</option><option>SNACK</option><option>BOTH</option><option>JOFFREYS</option><option>STARBUCKS</option></select><input id="query" placeholder="Search"></div></section>
<section class="panel"><h2>Trip Tools</h2><div class="grid"><button id="diningBtn">🍽️ Dining Results</button><button id="trackerBtn">✅ Trip Dashboard</button><button id="stepsBtn">👟 Daily Step Tracker</button></div></section>
<section id="dining"><div id="count" class="muted"></div><div id="cards" class="cards"></div></section>
<section id="tracker" class="panel hide"><h2>Trip Dashboard</h2><div id="stats" class="grid"></div><div id="tried"></div></section>
<section id="steps" class="panel hide"><h2>Daily Step Tracker</h2><div class="grid"><input type="date" id="date"><button id="export">Export CSV</button></div><div id="stepRows"></div><div id="stepStats"></div></section>
</main><script>
let C={features:{},participants:[]},P=[],D=[],mode='all';const $=x=>document.getElementById(x),v=(o,...k)=>{for(let x of k)if(o[x]!=null)return o[x];return''},truth=x=>x===true||/^(true|yes|1)$/i.test(String(x));
function normalize(r,i){let tags=v(r,'tags','Tags');if(typeof tags==='string')tags=tags.split(',').map(x=>x.trim().toLowerCase());return{id:v(r,'id','ID')||'r'+i,name:v(r,'name','Name','Location','location')||'Unnamed',item:v(r,'item','Item'),place:v(r,'park','Park','place')||'Other',area:v(r,'land','Land','area')||'General',type:String(v(r,'type','Type','category')).toUpperCase(),locationType:String(v(r,'locationType','LocationType')).toUpperCase(),rating:Number(v(r,'rating','Rating'))||0,wishlist:truth(v(r,'wishlist','Wishlist')),signature:truth(v(r,'signature','SignatureSnack','signatureSnack')),notes:v(r,'notes','Notes'),tags:tags||[],raw:r}}
function fav(r,p){let f=r.raw.favorites||r.raw.Favorites;return Array.isArray(f)?f.includes(p):truth(r.raw[p]??r.raw[p.toLowerCase()])}function selected(){return P.filter(x=>$(safe(x))?.checked)}function safe(x){return'p_'+x.replace(/[^a-z0-9]/gi,'_')}
function applyConfig(){P=(C.participants||[]).filter(x=>typeof x==='string'||x.active!==false).map(x=>typeof x==='string'?x:x.name).filter(Boolean);$('title').textContent=C.tripName||'Trip Companion';let f=C.features||{};[['pink','pinkDonutMode'],['sky','skylinerMode'],['signature','signatureSnacks'],['wishlist','wishlist'],['family','familyFavorites'],['trackerBtn','tripTracker']].forEach(([id,k])=>$(id).classList.toggle('hide',f[k]===false));$('stepsBtn').classList.toggle('hide',f.stepTracker!==true);$('people').innerHTML=P.map(x=>`<label><input id="${safe(x)}" type="checkbox"> ${esc(x)}</label>`).join('');P.forEach(x=>$(safe(x)).onchange=render)}function esc(x){return String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function locations(){let ps=[...new Set(D.map(x=>x.place))].sort(),parks=['Magic Kingdom','EPCOT','Hollywood Studios','Animal Kingdom','Disney Springs'];$('place').innerHTML='<option value="">All Locations</option><optgroup label="Parks & Disney Springs">'+parks.filter(x=>ps.includes(x)).map(x=>`<option>${x}</option>`).join('')+'</optgroup><optgroup label="Resorts">'+ps.filter(x=>!parks.includes(x)).map(x=>`<option>${x}</option>`).join('')+'</optgroup>';$('place').value=localStorage.ddPlace||'';areas()}function areas(){$('area').innerHTML='<option value="">All Areas</option>'+[...new Set(D.filter(x=>!$('place').value||x.place===$('place').value).map(x=>x.area))].sort().map(x=>`<option>${x}</option>`).join('');$('area').value=localStorage.ddArea||''}
function resort(r){return r.locationType==='RESORT'||r.tags.includes('resort')||/Century|Animation|Caribbean|Riviera|Contemporary|Polynesian|Floridian|BoardWalk|Beach|Yacht|Swan|Dolphin|Saratoga|Old Key|Coronado|Port Orleans|Lodge|Wilderness|All-Star/i.test(r.place)}
function rows(){let s=selected(),q=$('query').value.toLowerCase();return D.filter(r=>{if($('place').value&&r.place!==$('place').value)return false;if($('area').value&&r.area!==$('area').value)return false;if($('type').value&&r.type!==$('type').value)return false;if(q&&!JSON.stringify(r).toLowerCase().includes(q))return false;if(s.length){let n=s.filter(x=>fav(r,x)).length;if($('match').value==='all'?n<s.length:n===0)return false}if(mode==='nearby'&&!$('place').value)return false;if(mode==='pink'&&!(/JOFFREY/.test(r.type)||r.tags.includes('joffreys')||/joffrey/i.test(r.name)))return false;if(mode==='sky'&&!r.tags.includes('skyliner')&&!/Pop Century|Art of Animation|Caribbean Beach|Riviera|Hollywood Studios|EPCOT|BoardWalk|Beach Club|Yacht Club/i.test(r.place))return false;if(mode==='signature'&&!r.signature&&!r.tags.includes('signature'))return false;if(mode==='wishlist'&&!r.wishlist)return false;if(mode==='resort'&&!resort(r))return false;return true}).sort((a,b)=>s.filter(x=>fav(b,x)).length-s.filter(x=>fav(a,x)).length||b.rating-a.rating)}
function tried(){return JSON.parse(localStorage.ddTried||'{}')}window.mark=(id,on)=>{let t=tried();if(on)t[id]={date:new Date().toLocaleDateString()};else delete t[id];localStorage.ddTried=JSON.stringify(t);render()};function render(){let R=rows(),t=tried();$('count').textContent=R.length+' results';$('cards').innerHTML=R.map(r=>{let likes=P.filter(x=>fav(r,x));return`<article class="card"><h3>${esc(r.item||r.name)}</h3>${r.item?`<div class="muted">at ${esc(r.name)}</div>`:''}<div><span class="tag">${esc(r.place)}</span><span class="tag">${esc(r.area)}</span><span class="tag">${esc(r.type||'Dining')}</span></div><div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(Math.max(0,5-r.rating))}</div><p>${esc(r.notes)}</p><div class="muted">Favorites: ${likes.map(esc).join(', ')||'None'}</div><label><input type="checkbox" ${t[r.id]?'checked':''} onchange="mark('${r.id}',this.checked)"> Tried this trip</label></article>`}).join('')||'<div class="panel">No matches.</div>'}
function show(id){['dining','tracker','steps'].forEach(x=>$(x).classList.toggle('hide',x!==id))}function dashboard(){let t=tried(),R=D.filter(x=>t[x.id]);let vals={Total:R.length,'Quick Service':R.filter(x=>x.type==='QS').length,Snacks:R.filter(x=>x.type==='SNACK'||x.signature).length,"Joffrey's":R.filter(x=>/JOFFREY/.test(x.type)||/joffrey/i.test(x.name)).length};$('stats').innerHTML=Object.entries(vals).map(([k,n])=>`<div class="panel"><div class="stat">${n}</div>${k}</div>`).join('');$('tried').innerHTML=R.map(x=>`<div>${esc(x.item||x.name)} <span class="muted">${esc(x.place)}</span></div>`).join('')}
function stepData(){return JSON.parse(localStorage.ddSteps||'{}')}function stepRender(){let d=stepData(),date=$('date').value,row=d[date]||{};$('stepRows').innerHTML='<table><tr><th>Person</th><th>Steps</th></tr>'+P.map(p=>`<tr><td>${esc(p)}</td><td><input type="number" value="${row[p]||''}" onchange="setStep('${p.replace(/'/g,"\\'")}',this.value)"></td></tr>`).join('')+'</table>';let a=P.map(p=>Number(row[p])||0);$('stepStats').innerHTML=`<div class="panel"><div class="stat">${a.reduce((x,y)=>x+y,0).toLocaleString()}</div>Group total</div>`}window.setStep=(p,n)=>{let d=stepData(),date=$('date').value;d[date]=d[date]||{};d[date][p]=Number(n)||0;localStorage.ddSteps=JSON.stringify(d);stepRender()};function exportSteps(){let d=stepData(),csv='Date,'+P.join(',')+'\n'+Object.keys(d).sort().map(x=>[x,...P.map(p=>d[x][p]||0)].join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv]));a.download='steps.csv';a.click()}
function setup(){document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));render()});$('place').onchange=()=>{areas();render()};['area','type','query','match'].forEach(x=>$(x).oninput=render);$('remember').onclick=()=>{localStorage.ddPlace=$('place').value;localStorage.ddArea=$('area').value};$('diningBtn').onclick=()=>show('dining');$('trackerBtn').onclick=()=>{show('tracker');dashboard()};$('stepsBtn').onclick=()=>{show('steps');stepRender()};$('date').value=new Date().toISOString().slice(0,10);$('date').onchange=stepRender;$('export').onclick=exportSteps}
Promise.all([fetch('config.json?'+Date.now()).then(r=>r.json()),fetch('restaurants.json?'+Date.now()).then(r=>r.json())]).then(([c,j])=>{C=c;D=(Array.isArray(j)?j:j.locations||j.restaurants||[]).map(normalize);applyConfig();setup();locations();render()}).catch(e=>$('cards').innerHTML='<div class="panel">Could not load config.json or restaurants.json. Keep both beside index.html.</div>');
</script></body></html>
