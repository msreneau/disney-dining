<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Trip Companion</title><style>
:root{--navy:#17233c;--pink:#e83e8c;--sky:#167fac;--bg:#f4f7fb;--line:#dbe1ea;--green:#147b51}*{box-sizing:border-box}body{margin:0;font:15px Arial;background:var(--bg);color:#17233c;padding-bottom:76px}.top{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 2px 10px #0002}.brand{background:linear-gradient(135deg,#17233c,#405781);color:#fff;padding:8px 14px;font-size:14px}.location{padding:10px 12px 7px}.location-row{display:grid;grid-template-columns:1fr 1fr auto;gap:7px}.location select,.location button,.drawer input,.drawer select,.drawer button{min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px;font:inherit}.quick{display:flex;gap:6px;padding:5px 10px 10px;overflow-x:auto}.quick button{flex:1 0 63px;min-width:63px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:7px 4px;font:inherit}.quick .icon{display:block;font-size:20px}.quick small{display:block;font-size:10px;margin-top:2px}.quick button.active{background:var(--navy);color:#fff}.quick .pink.active{background:var(--pink)}.quick .sky.active{background:var(--sky)}main{max-width:1050px;margin:auto;padding:10px}.summary{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 8px;color:#667085}.clear{border:0;background:none;color:#225f9b}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:10px}.card,.panel{background:#fff;border-radius:13px;padding:13px;box-shadow:0 2px 8px #0001}.card h3{margin:0 0 4px;font-size:18px}.muted{color:#667085;font-size:13px}.tag{display:inline-block;background:#edf1f6;border-radius:11px;padding:3px 7px;margin:5px 3px 5px 0;font-size:12px}.stars{color:#eda400}.card-links{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.card-links a{display:inline-block;text-deco.drawer-bg{display:none;position:fixed;inset:0;background:#0006;z-index:40}.drawer-bg.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(92%,390px);background:#fff;padding:16px;overflow:auto}.drawer h2{margin-top:0}.drawer .field{margin:13px 0}.drawer input,.drawer select{width:100%}.people label{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:8px 10px;margin:3px}.people input{margin-right:4px}.drawer-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:sticky;bottom:0;background:#fff;padding:10px 0}.primary{background:var(--navy)!important;color:#fff}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:25;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.bottom button{flex:1;border:0;background:#fff;padding:9px 2px;font:inherit;color:#596579}.bottom button.active{color:var(--navy);font-weight:bold}.bottom span{display:block;font-size:20px}.view.hide,.hide{display:none!important}.stat{font-size:25px;font-weight:bold;color:var(--green)}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}.toast{display:none;position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#17233c;color:#fff;padding:9px 14px;border-radius:20px;z-index:60}.toast.show{display:block}@media(max-width:600px){.brand{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.location-row{grid-template-columns:1fr 1fr}.location-row button{grid-column:1/-1;min-height:34px}.cards{grid-template-columns:1fr}.quick{scrollbar-width:none}}
</style></head><body><header class="top"><div class="brand">🏰 <strong id="title">Trip Companion</strong></div><div class="location"><div class="location-row"><select id="place"></select><select id="area"></select><button id="remember">📍 Remember</button></div></div><nav class="quick"><button class="mode pink" id="pink" data-mode="pink"><span class="icon">🍩</span><small>Pink Donut</small></button><button class="mode sky" id="sky" data-mode="sky"><span class="icon">🚡</span><small>Skyliner</small></button><button class="mode" id="wish" data-mode="wishlist"><span class="icon">⭐</span><small>Wishlist</small></button><button id="familyBtn"><span class="icon">👥</span><small>Family</small></button><button class="mode" data-mode="resort"><span class="icon">🏨</span><small>Resorts</small></button><button id="filterBtn"><span class="icon">⚙️</span><small>Filters</small></button></nav></header>
<main><section id="dining" class="view"><div class="summary"><span id="count"></span><button class="clear" id="clear">Clear filters</button></div><div id="cards" class="cards"></div></section><section id="tracker" class="view hide"><div class="panel"><h2>Trip Dashboard</h2><div id="stats" class="cards"></div><h3>Tried this trip</h3><div id="tried"></div></div></section><section id="steps" class="view hide"><div class="panel"><h2>Daily Step Tracker</h2><input type="date" id="date"><button id="export">Export CSV</button><div id="stepRows"></div><div id="stepStats"></div></div></section></main>
<nav class="bottom"><button id="navDining" class="active"><span>🍽️</span>Dining</button><button id="navTrip"><span>✅</span>Trip</button><button id="navSteps"><span>👟</span>Steps</button><button id="navSettings"><span>⚙️</span>Settings</button></nav>
<div class="drawer-bg" id="drawerBg"><aside class="drawer"><h2 id="drawerTitle">Filters</h2><div id="filterContent"><div class="field"><label>Search</label><input id="query" placeholder="Restaurant, snack or notes"></div><div class="field"><label>Type</label><select id="type"><option value="">All Types</option><option>QS</option><option>SNACK</option><option>BOTH</option><option>JOFFREYS</option><option>STARBUCKS</option></select></div><div class="field" id="peopleField"><label>Family members</label><div id="people" class="people"></div></div><div class="field" id="matchField"><label>Family matching</label><select id="match"><option value="any">Any selected person</option><option value="all">Everyone selected</option></select></div></div><div class="drawer-actions"><button id="reset">Reset</button><button id="apply" class="primary">Show Results</button></div></aside></div><div id="toast" class="toast">Location saved</div>
<script>
let C={features:{},participants:[]},P=[],D=[],mode='all';const $=x=>document.getElementById(x),val=(o,...ks)=>{for(const k of ks)if(o[k]!=null)return o[k];return''},truth=x=>x===true||/^(true|yes|1)$/i.test(String(x)),esc=x=>String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function norm(r,i){let tags=val(r,'tags','Tags');if(typeof tags==='string')tags=tags.split(',').map(x=>x.trim().toLowerCase());return{id:val(r,'id','ID')||'r'+i,name:val(r,'name','Name','Location','location')||'Unnamed',item:val(r,'item','Item'),place:val(r,'park','Park','place')||'Other',area:val(r,'land','Land','area')||'General',type:String(val(r,'type','Type','category')).toUpperCase(),locationType:String(val(r,'locationType','LocationType')).toUpperCase(),rating:Number(val(r,'rating','Rating'))||0,wishlist:truth(val(r,'wishlist','Wishlist')),signature:truth(val(r,'signature','SignatureSnack','signatureSnack')),notes:val(r,'notes','Notes'),menuUrl:val(r,'menuUrl','MenuURL','menuURL','menu'),mobileOrderUrl:val(r,'mobileOrderUrl','MobileO
function sid(x){return'p_'+x.replace(/[^a-z0-9]/gi,'_')}function fav(r,p){let f=r.raw.favorites||r.raw.Favorites;return Array.isArray(f)?f.includes(p):truth(r.raw[p]??r.raw[p.toLowerCase()])}function selected(){return P.filter(x=>$(sid(x))?.checked)}
function config(){P=(C.participants||[]).filter(x=>typeof x==='string'||x.active!==false).map(x=>typeof x==='string'?x:x.name).filter(Boolean);$('title').textContent=C.tripName||'Trip Companion';let f=C.features||{};$('pink').classList.toggle('hide',f.pinkDonutMode===false);$('sky').classList.toggle('hide',f.skylinerMode===false);$('wish').classList.toggle('hide',f.wishlist===false);$('familyBtn').classList.toggle('hide',f.familyFavorites===false);$('peopleField').classList.toggle('hide',f.familyFavorites===false);$('matchField').classList.toggle('hide',f.familyFavorites===false);$('navTrip').classList.toggle('hide',f.tripTracker===false);$('navSteps').classList.toggle('hide',f.stepTracker!==true);$('people').innerHTML=P.map(p=>`<label><input id="${sid(p)}" type="checkbox">${esc(p)}</label>`).join('')}
function locations(){let ps=[...new Set(D.map(x=>x.place))].sort(),parks=['Magic Kingdom','EPCOT','Hollywood Studios','Animal Kingdom','Disney Springs'];$('place').innerHTML='<option value="">All Locations</option><optgroup label="Parks & Disney Springs">'+parks.filter(x=>ps.includes(x)).map(x=>`<option>${x}</option>`).join('')+'</optgroup><optgroup label="Resorts">'+ps.filter(x=>!parks.includes(x)).map(x=>`<option>${x}</option>`).join('')+'</optgroup>';$('place').value=localStorage.ddPlace||'';areas()}function areas(){$('area').innerHTML='<option value="">All Areas</option>'+[...new Set(D.filter(x=>!$('place').value||x.place===$('place').value).map(x=>x.area))].sort().map(x=>`<option>${x}</option>`).join('');$('area').value=localStorage.ddArea||''}
function isResort(r){return r.locationType==='RESORT'||r.tags.includes('resort')||/Century|Animation|Caribbean|Riviera|Contemporary|Polynesian|Floridian|BoardWalk|Beach|Yacht|Swan|Dolphin|Saratoga|Old Key|Coronado|Port Orleans|Lodge|Wilderness|All-Star/i.test(r.place)}
function filtered(){let s=selected(),q=$('query').value.toLowerCase();return D.filter(r=>{if($('place').value&&r.place!==$('place').value)return false;if($('area').value&&r.area!==$('area').value)return false;if($('type').value&&r.type!==$('type').value)return false;if(q&&!JSON.stringify(r).toLowerCase().includes(q))return false;if(s.length){let n=s.filter(x=>fav(r,x)).length;if($('match').value==='all'?n<s.length:n===0)return false}if(mode==='pink'&&!(/JOFFREY/.test(r.type)||r.tags.includes('joffreys')||/joffrey/i.test(r.name)))return false;if(mode==='sky'&&!r.tags.includes('skyliner')&&!/Pop Century|Art of Animation|Caribbean Beach|Riviera|Hollywood Studios|EPCOT|BoardWalk|Beach Club|Yacht Club/i.test(r.place))return false;if(mode==='wishlist'&&!r.wishlist)return false;if(mode==='resort'&&!isResort(r))return false;return true}).sort((a,b)=>s.filter(x=>fav(b,x)).length-s.filter(x=>fav(a,x)).length||b.rating-a.rating)}
function safeUrl(u){u=String(u||'').trim();try{let x=new URL(u);return['http:','https:'].includes(x.protocol)?u:''}catch{return''}}function linkButtons(r){let links=[[r.menuUrl,'Menu'],[r.mobileOrderUrl,'Mobile Order'],[r.mapUrl,'Map']].filter(([u])=>safeUrl(u));return links.length?`<div class="card-links">${links.map(([u,l])=>`<a href="${safeUrl(u)}" target="_blank" rel="noopener 
function tried(){return JSON.parse(localStorage.ddTried||'{}')}window.mark=(id,on)=>{let t=tried();if(on)t[id]={date:new Date().toLocaleDateString()};else delete t[id];localStorage.ddTried=JSON.stringify(t);render()};function render(){let R=filtered(),t=tried(),bits=[];if(mode!=='all')bits.push(mode);if($('type').value)bits.push($('type').value);if(selected().length)bits.push(selected().join(', '));$('count').textContent=R.length+' results'+(bits.length?' • '+bits.join(' • '):'');$('clear').style.visibility=bits.length||$('query').value?'visible':'hidden';$('cards').innerHTML=R.map(r=>{let likes=P.filter(x=>fav(r,x));return`<article class="card"><h3>${esc(r.item||r.name)}</h3>${r.item?`<div class="muted">at ${esc(r.name)}</div>`:''}<div><span class="tag">${esc(r.place)}</span><span class="tag">${esc(r.area)}</span><span class="tag">${esc(r.type||'Dining')}</span></div><div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(Math.max(0,5-r.rating))}</div>${r.notes?`<p>${esc(r.notes)}</p>`:''}${linkButtons(r)}<div class="muted">Favorites: ${likes.map(esc).join(', ')||'None'}</div><label><input type="checkbox" ${t[r.id]?'checked':''} onchange="mark('${r.id}',this.checked)"> Tried this trip</label></article>`}).join('')||'<div class="panel">No matches. Tap Clear filters to start over.</div>'}
function drawer(title){$('drawerTitle').textContent=title;$('drawerBg').classList.add('open')}function closeDrawer(){$('drawerBg').classList.remove('open')}function clearAll(){mode='all';$('query').value='';$('type').value='';$('match').value='any';P.forEach(p=>{if($(sid(p)))$(sid(p)).checked=false});document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));render()}
function show(id){['dining','tracker','steps'].forEach(x=>$(x).classList.toggle('hide',x!==id));[['navDining','dining'],['navTrip','tracker'],['navSteps','steps']].forEach(([b,v])=>$(b).classList.toggle('active',v===id))}function dashboard(){let t=tried(),R=D.filter(x=>t[x.id]),v={Total:R.length,'Quick Service':R.filter(x=>x.type==='QS').length,Snacks:R.filter(x=>x.type==='SNACK'||x.signature).length,"Joffrey's":R.filter(x=>/JOFFREY/.test(x.type)||/joffrey/i.test(x.name)).length};$('stats').innerHTML=Object.entries(v).map(([k,n])=>`<div class="panel"><div class="stat">${n}</div>${k}</div>`).join('');$('tried').innerHTML=R.map(x=>`<div>${esc(x.item||x.name)} <span class="muted">${esc(x.place)}</span></div>`).join('')||'<p class="muted">Nothing marked tried yet.</p>'}
function stepData(){return JSON.parse(localStorage.ddSteps||'{}')}function steps(){let d=stepData(),row=d[$('date').value]||{};$('stepRows').innerHTML='<table><tr><th>Person</th><th>Steps</th></tr>'+P.map(p=>`<tr><td>${esc(p)}</td><td><input type="number" value="${row[p]||''}" onchange="setStep('${p.replace(/'/g,"\\'")}',this.value)"></td></tr>`).join('')+'</table>';let a=P.map(p=>Number(row[p])||0);$('stepStats').innerHTML=`<div class="panel"><div class="stat">${a.reduce((x,y)=>x+y,0).toLocaleString()}</div>Group total</div>`}window.setStep=(p,n)=>{let d=stepData(),date=$('date').value;d[date]=d[date]||{};d[date][p]=Number(n)||0;localStorage.ddSteps=JSON.stringify(d);steps()};
function setup(){document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=mode===b.dataset.mode?'all':b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));render();show('dining')});$('place').onchange=()=>{areas();render()};$('area').onchange=render;$('remember').onclick=()=>{localStorage.ddPlace=$('place').value;localStorage.ddArea=$('area').value;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1200)};$('filterBtn').onclick=()=>drawer('Filters');$('familyBtn').onclick=()=>drawer('Family Favorites');$('navSettings').onclick=()=>drawer('Filters');$('apply').onclick=()=>{closeDrawer();render();show('dining')};$('reset').onclick=clearAll;$('clear').onclick=clearAll;$('drawerBg').onclick=e=>{if(e.target===$('drawerBg'))closeDrawer()};$('query').oninput=render;$('type').onchange=render;$('match').onchange=render;P.forEach(p=>$(sid(p)).onchange=render);$('navDining').onclick=()=>show('dining');$('navTrip').onclick=()=>{show('tracker');dashboard()};$('navSteps').onclick=()=>{show('steps');steps()};$('date').value=new Date().toISOString().slice(0,10);$('date').onchange=steps;$('export').onclick=()=>{let d=stepData(),csv='Date,'+P.join(',')+'\n'+Object.keys(d).sort().map(x=>[x,...P.map(p=>d[x][p]||0)].join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv]));a.download='steps.csv';a.click()}}
Promise.all([fetch('config.json?'+Date.now()).then(r=>r.json()),fetch('restaurants.json?'+Date.now()).then(r=>r.json())]).then(([c,j])=>{C=c;D=(Array.isArray(j)?j:j.locations||j.restaurants||[]).map(norm);config();setup();locations();render()}).catch(()=>$('cards').innerHTML='<div class="panel">Could not load config.json or restaurants.json. Keep both beside index.html.</div>');
</script></body></html>
