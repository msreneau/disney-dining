<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dining Data Admin</title><style>
:root{--navy:#17233c;--bg:#f4f7fb;--line:#d7deea;--good:#168255;--warn:#b77900;--bad:#bd2525}*{box-sizing:border-box}body{margin:0;font:15px Arial;background:var(--bg);color:#17233c}header{background:linear-gradient(135deg,#17233c,#405781);color:#fff;padding:17px}.wrap{max-width:1150px;margin:auto;padding:14px}.panel,.card{background:#fff;border-radius:13px;padding:14px;margin:10px 0;box-shadow:0 2px 9px #0001}.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px}.metric{border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;text-align:left;cursor:pointer}.metric strong{display:block;font-size:25px}.metric.bad strong{color:var(--bad)}.metric.warn strong{color:var(--warn)}.tools,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}input,select,textarea,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}button{cursor:pointer}.primary{background:var(--navy);color:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:11px}.card h3{margin:0}.meta{color:#687386;font-size:13px;margin:4px 0 10px}.badge{display:inline-block;border-radius:15px;padding:4px 8px;font-size:12px;margin:4px 0}.complete{background:#e4f5ec;color:#09683f}.missing{background:#fff3cf;color:#845500}.invalid{background:#fde5e5;color:#a41212}.url-row{display:grid;grid-template-columns:1fr auto;gap:6px;margin:9px 0}.url-row label{grid-column:1/-1;font-weight:bold}.url-row input{width:100%}.url-row input.valid{border:2px solid var(--good);background:#f2fbf6}.url-row input.blank{border:2px solid #e5b53d;background:#fffaf0}.url-row input.invalid-field{border:2px solid var(--bad);background:#fff3f3}.status{grid-column:1/-1;font-size:12px}.status.valid{color:var(--good)}.status.blank{color:var(--warn)}.status.invalid-field{color:var(--bad)}textarea{width:100%;min-height:64px}.counts{color:#667085}.sticky{position:sticky;top:0;z-index:20;background:var(--bg);padding:5px 0}.hide{display:none!important}@media(max-width:600px){.cards{grid-template-columns:1fr}.url-row{grid-template-columns:1fr}.url-row button{width:100%}}
</style></head><body><header><div class="wrap"><h1>Dining Data Admin</h1><div>Edit and validate Menu, Mobile Order, and Map links</div></div></header><main class="wrap">
<section class="panel"><h2>Link Maintenance Dashboard</h2><div class="dashboard"><button class="metric warn" data-filter="missingMenu"><strong id="missingMenuCount">0</strong>Missing Menu URLs</button><button class="metric warn" data-filter="missingMobile"><strong id="missingMobileCount">0</strong>Missing Mobile Order URLs</button><button class="metric warn" data-filter="missingMap"><strong id="missingMapCount">0</strong>Missing Map URLs</button><button class="metric bad" data-filter="invalid"><strong id="invalidCount">0</strong>Invalid URLs</button><button class="metric bad" data-filter="problems"><strong id="problemCount">0</strong>Problem Records</button></div></section>
<section class="panel sticky"><div class="tools"><input id="search" placeholder="Search location, park, land or notes"><select id="filter"><option value="all">All Records</option><option value="missingMenu">Missing Menu URL</option><option value="missingMobile">Missing Mobile Order URL</option><option value="missingMap">Missing Map URL</option><option value="invalid">Invalid URL</option><option value="problems">Problem Records</option><option value="complete">Complete Link Records</option></select><button id="download" class="primary">Download Updated restaurants.json</button></div><p id="shown" class="counts"></p></section>
<section id="cards" class="cards"></section></main><script>
let ROOT,ROWS=[];const $=x=>document.getElementById(x),get=(o,...ks)=>{for(const k of ks)if(o[k]!=null)return o[k];return''};
const FIELDS={menu:['menuUrl','MenuURL','menuURL','menu'],mobile:['mobileOrderUrl','MobileOrderURL','mobileOrderURL','mobile'],map:['mapUrl','MapURL','mapURL','map']};
function keyFor(r,type){let ks=FIELDS[type];return ks.find(k=>Object.prototype.hasOwnProperty.call(r,k))||ks[0]}function url(r,type){return String(get(r,...FIELDS[type])||'').trim()}function state(u){if(!u)return'blank';try{let x=new URL(u);return (x.protocol==='http:'||x.protocol==='https:')?'valid':'invalid-field'}catch{return'invalid-field'}}
function status(r){let s={menu:state(url(r,'menu')),mobile:state(url(r,'mobile')),map:state(url(r,'map'))};s.invalid=Object.values(s).includes('invalid-field');s.missing=Object.values(s).includes('blank');s.complete=!s.invalid&&!s.missing;return s}function title(r){return get(r,'Item','item','Location','location','Name','name')||'Unnamed Entry'}function meta(r){return [get(r,'Park','park','place'),get(r,'Land','land','area')].filter(Boolean).join(' • ')}function esc(x){return String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function matches(r,f){let s=status(r);if(f==='all')return true;if(f==='missingMenu')return s.menu==='blank';if(f==='missingMobile')return s.mobile==='blank';if(f==='missingMap')return s.map==='blank';if(f==='invalid')return s.invalid;if(f==='problems')return s.invalid||s.missing;if(f==='complete')return s.complete;return true}
function dashboard(){let mm=0,mo=0,mp=0,inv=0,prob=0;ROWS.forEach(r=>{let s=status(r);if(s.menu==='blank')mm++;if(s.mobile==='blank')mo++;if(s.map==='blank')mp++;if(s.invalid)inv++;if(s.invalid||s.missing)prob++});$('missingMenuCount').textContent=mm;$('missingMobileCount').textContent=mo;$('missingMapCount').textContent=mp;$('invalidCount').textContent=inv;$('problemCount').textContent=prob}
function badge(s){if(s.invalid)return'<span class="badge invalid">🔴 Invalid URL</span>';if(s.missing)return'<span class="badge missing">🟡 Missing Link</span>';return'<span class="badge complete">🟢 Links Complete</span>'}function field(r,i,type,label){let u=url(r,type),st=state(u),text=st==='valid'?'Valid URL':st==='blank'?'Missing URL':'Invalid URL: use http:// or https://';return`<div class="url-row"><label>${label}</label><input class="${st}" data-i="${i}" data-type="${type}" value="${esc(u)}" placeholder="https://..."><button data-open="${type}" data-i="${i}" ${st!=='valid'?'disabled':''}>Open</button><span class="status ${st}">${text}</span></div>`}
function render(){let q=$('search').value.toLowerCase(),f=$('filter').value,list=ROWS.map((r,i)=>({r,i})).filter(({r})=>matches(r,f)&&JSON.stringify(r).toLowerCase().includes(q));$('shown').textContent=`Showing ${list.length} of ${ROWS.length} records`;$('cards').innerHTML=list.map(({r,i})=>{let s=status(r);return`<article class="card"><h3>${esc(title(r))}</h3><div class="meta">${esc(meta(r))}</div>${badge(s)}${field(r,i,'menu','Menu URL')}${field(r,i,'mobile','Mobile Order URL')}${field(r,i,'map','Map URL')}<label>Notes</label><textarea data-notes="${i}">${esc(get(r,'Notes','notes'))}</textarea></article>`}).join('')||'<div class="panel">No records match this filter.</div>';bind()}
function bind(){document.querySelectorAll('[data-type]').forEach(e=>e.oninput=()=>{let r=ROWS[+e.dataset.i],k=keyFor(r,e.dataset.type);r[k]=e.value.trim();dashboard();render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{let u=url(ROWS[+b.dataset.i],b.dataset.open);if(state(u)==='valid')window.open(u,'_blank','noopener')});document.querySelectorAll('[data-notes]').forEach(e=>e.oninput=()=>{let r=ROWS[+e.dataset.notes],k=Object.prototype.hasOwnProperty.call(r,'Notes')?'Notes':'notes';r[k]=e.value})}
function download(){let out=Array.isArray(ROOT)?ROWS:{...ROOT,[ROOT.locations?'locations':'restaurants']:ROWS};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='restaurants.json';a.click()}
$('search').oninput=render;$('filter').onchange=render;$('download').onclick=download;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{$('filter').value=b.dataset.filter;render();scrollTo({top:document.querySelector('.sticky').offsetTop,behavior:'smooth'})});
fetch('restaurants.json?'+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}).then(j=>{ROOT=j;ROWS=Array.isArray(j)?j:(j.locations||j.restaurants||[]);dashboard();render()}).catch(()=>{$('cards').innerHTML='<div class="panel"><strong>Could not load restaurants.json.</strong><br>Place admin-dining.html in the same GitHub folder as restaurants.json.</div>'});
</script></body></html>
