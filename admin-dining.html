<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dining Data Admin</title><style>
:root{--navy:#17233c;--bg:#f4f7fb;--line:#d7deea;--good:#168255;--warn:#a96c00;--bad:#bd2525}*{box-sizing:border-box}body{margin:0;font:15px Arial;background:var(--bg);color:#17233c}header{background:linear-gradient(135deg,#17233c,#405781);color:#fff;padding:17px}.wrap{max-width:1180px;margin:auto;padding:14px}.panel,.card{background:#fff;border-radius:13px;padding:14px;margin:10px 0;box-shadow:0 2px 9px #0001}.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.metric{border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;text-align:left;cursor:pointer}.metric strong{display:block;font-size:25px}.bad strong{color:var(--bad)}.warn strong{color:var(--warn)}.good strong{color:var(--good)}.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px}input,select,textarea,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}button{cursor:pointer}.primary{background:var(--navy);color:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(335px,1fr));gap:11px}.card h3{margin:0}.meta,.counts{color:#687386;font-size:13px}.badge{display:inline-block;border-radius:15px;padding:4px 8px;font-size:12px;margin:6px 3px 6px 0}.complete{background:#e4f5ec;color:#09683f}.missing{background:#fff3cf;color:#845500}.invalid{background:#fde5e5;color:#a41212}.due{background:#fff0d7;color:#8a5100}.url-row{display:grid;grid-template-columns:1fr auto;gap:6px;margin:9px 0}.url-row label{grid-column:1/-1;font-weight:bold}.url-row input{width:100%}.valid{border:2px solid var(--good)!important;background:#f2fbf6!important}.blank{border:2px solid #e5b53d!important;background:#fffaf0!important}.invalid-field{border:2px solid var(--bad)!important;background:#fff3f3!important}.status{grid-column:1/-1;font-size:12px}.status.valid{color:var(--good)}.status.blank{color:var(--warn)}.status.invalid-field{color:var(--bad)}.verify-row{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:12px;padding-top:11px;border-top:1px solid #e8eaf0}.verify-row label{grid-column:1/-1;font-weight:bold}.verify-note{grid-column:1/-1;font-size:12px;color:#667085}textarea{width:100%;min-height:60px}.sticky{position:sticky;top:0;z-index:20;background:var(--bg);padding:5px 0}@media(max-width:700px){.cards{grid-template-columns:1fr}.tools{grid-template-columns:1fr}.url-row,.verify-row{grid-template-columns:1fr}}

.admin-nav{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px #0002;padding:8px max(10px,env(safe-area-inset-left))}.admin-nav-inner{max-width:1180px;margin:auto;display:flex;flex-wrap:wrap;gap:7px}.admin-nav a{flex:1 1 auto;min-width:105px;text-align:center;text-decoration:none;color:var(--navy);background:#f1f4f8;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-weight:700}.admin-nav a.active{background:var(--navy);color:#fff}.admin-nav a.github{background:#24292f;color:#fff}.admin-nav a:hover{filter:brightness(.96)}@media(max-width:520px){.admin-nav-inner{display:grid;grid-template-columns:1fr 1fr}.admin-nav a{min-width:0}.admin-nav a:first-child,.admin-nav a:last-child{grid-column:auto}}
</style></head><body><nav class="admin-nav" aria-label="Admin navigation"><div class="admin-nav-inner"><a href="./index.html">🏰 Open App</a><a href="./admin.html">⚙️ Config</a><a href="./admin-dining.html" class="active" aria-current="page">🍽️ Dining</a><a class="github" href="https://github.com/msreneau/disney-dining" target="_blank" rel="noopener noreferrer">📂 GitHub</a></div></nav><header><div class="wrap"><h1>Dining Data Admin</h1><div>Link maintenance and verification tracking</div></div></header><main class="wrap">
<section class="panel"><h2>Link Maintenance Dashboard</h2><div class="dashboard"><button class="metric warn" data-filter="missingMenu"><strong id="cMenu">0</strong>Missing Menu</button><button class="metric warn" data-filter="missingMobile"><strong id="cMobile">0</strong>Missing Mobile Order</button><button class="metric warn" data-filter="missingMap"><strong id="cMap">0</strong>Missing Map</button><button class="metric bad" data-filter="invalid"><strong id="cInvalid">0</strong>Invalid URLs</button><button class="metric bad" data-filter="problems"><strong id="cProblems">0</strong>Problem Records</button></div><h2>Verification Dashboard</h2><div class="dashboard"><button class="metric bad" data-filter="neverVerified"><strong id="cNever">0</strong>Never Verified</button><button class="metric warn" data-filter="needsVerification"><strong id="cDue">0</strong>Needs Verification<br><small>Older than 180 days</small></button><button class="metric good" data-filter="verifiedCurrent"><strong id="cCurrent">0</strong>Verified Within 180 Days</button></div></section>
<section class="panel sticky"><div class="tools"><input id="search" placeholder="Search location, park, land or notes"><select id="filter"><option value="all">All Records</option><option value="missingMenu">Missing Menu URL</option><option value="missingMobile">Missing Mobile Order URL</option><option value="missingMap">Missing Map URL</option><option value="invalid">Invalid URL</option><option value="problems">Problem Records</option><option value="complete">Complete Links</option><option value="neverVerified">Never Verified</option><option value="needsVerification">Needs Verification (older than 180 days)</option><option value="verifiedCurrent">Verified Within 180 Days</option></select><button id="download" class="primary">Download Updated restaurants.json</button></div><p id="shown" class="counts"></p></section><section id="cards" class="cards"></section></main><script>
let ROOT,ROWS=[];const $=x=>document.getElementById(x),get=(o,...ks)=>{for(const k of ks)if(o[k]!=null)return o[k];return''};const F={menu:['menuUrl','MenuURL','menuURL','menu'],mobile:['mobileOrderUrl','MobileOrderURL','mobileOrderURL','mobile'],mobileEnabled:['showMobileOrdering','mobileOrdering','ShowMobileOrdering'],map:['mapUrl','MapURL','mapURL','map'],verified:['lastVerified','LastVerified','lastverified']};
function mobileEnabled(r){return get(r,...F.mobileEnabled)===true||/^(true|yes|1)$/i.test(String(get(r,...F.mobileEnabled)||''))}function mobileKey(r){return F.mobileEnabled.find(k=>Object.prototype.hasOwnProperty.call(r,k))||F.mobileEnabled[0]}function generatedMobileUrl(r){let u=url(r,'menu');return u?u.replace(/\/+$/,'')+'/mobile-ordering/':''}function key(r,t){return F[t].find(k=>Object.prototype.hasOwnProperty.call(r,k))||F[t][0]}function url(r,t){return String(get(r,...F[t])||'').trim()}function ustate(u){if(!u)return'blank';try{let x=new URL(u);return['http:','https:'].includes(x.protocol)?'valid':'invalid-field'}catch{return'invalid-field'}}function verified(r){return String(get(r,...F.verified)||'').trim()}function parseDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;let d=new Date(s+'T00:00:00');return isNaN(d)?null:d}function ageDays(s){let d=parseDate(s);if(!d)return null;let today=new Date();today.setHours(0,0,0,0);return Math.floor((today-d)/86400000)}function vstate(r){let s=verified(r),age=ageDays(s);if(!s||age===null)return'never';return age>180?'due':'current'}function status(r){let s={menu:ustate(url(r,'menu')),mobile:ustate(url(r,'mobile')),map:ustate(url(r,'map')),verify:vstate(r)};s.invalid=[s.menu,s.mobile,s.map].includes('invalid-field');s.missing=[s.menu,s.mobile,s.map].includes('blank');s.complete=!s.invalid&&!s.missing;return s}function esc(x){return String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function title(r){return get(r,'Location','location','Name','name')||'Unnamed Entry'}function meta(r){const type = get(r,'Type','type');const park = get(r,'Park','park','place');const land = get(r,'Land','land','area');const icon =type === 'QS' ? '🟦' :type === 'SNACK' ? '🟩' :'⬜';return [icon + ' ' + type,park,land].filter(Boolean).join(' • ');}
function matches(r,f){let s=status(r);return f==='all'||f==='missingMenu'&&s.menu==='blank'||f==='missingMobile'&&s.mobile==='blank'||f==='missingMap'&&s.map==='blank'||f==='invalid'&&s.invalid||f==='problems'&&(s.invalid||s.missing)||f==='complete'&&s.complete||f==='neverVerified'&&s.verify==='never'||f==='needsVerification'&&s.verify==='due'||f==='verifiedCurrent'&&s.verify==='current'}
function dashboard(){let n={menu:0,mobile:0,map:0,invalid:0,problems:0,never:0,due:0,current:0};ROWS.forEach(r=>{let s=status(r);if(s.menu==='blank')n.menu++;if(s.mobile==='blank')n.mobile++;if(s.map==='blank')n.map++;if(s.invalid)n.invalid++;if(s.invalid||s.missing)n.problems++;n[s.verify]++});$('cMenu').textContent=n.menu;$('cMobile').textContent=n.mobile;$('cMap').textContent=n.map;$('cInvalid').textContent=n.invalid;$('cProblems').textContent=n.problems;$('cNever').textContent=n.never;$('cDue').textContent=n.due;$('cCurrent').textContent=n.current}
function linkBadge(s){if(s.invalid)return'<span class="badge invalid">🔴 Invalid URL</span>';if(s.missing)return'<span class="badge missing">🟡 Missing Link</span>';return'<span class="badge complete">🟢 Links Complete</span>'}function verifyBadge(r){let s=vstate(r),d=verified(r);if(s==='never')return'<span class="badge invalid">🔴 Never Verified</span>';if(s==='due')return`<span class="badge due">🟡 Verification Due • ${esc(d)}</span>`;return`<span class="badge complete">🟢 Verified • ${esc(d)}</span>`}
function linkField(r,i,t,label){let u=url(r,t),st=ustate(u),msg=st==='valid'?'Valid URL':st==='blank'?'Missing URL':'Invalid URL: use http:// or https://';return`<div class="url-row"><label>${label}</label><input class="${st}" data-url="${t}" data-i="${i}" value="${esc(u)}" placeholder="https://..."><button data-open="${t}" data-i="${i}" ${st!=='valid'?'disabled':''}>Open</button><span class="status ${st}">${msg}</span></div>`}
function render(){let q=$('search').value.toLowerCase(),f=$('filter').value,L=ROWS.map((r,i)=>({r,i})).filter(({r})=>matches(r,f)&&JSON.stringify(r).toLowerCase().includes(q));$('shown').textContent=`Showing ${L.length} of ${ROWS.length} records`;$('cards').innerHTML=L.map(({r,i})=>`<article class="card"><h3>${esc(title(r))}</h3><div class="meta">${esc(meta(r))}</div>${linkBadge(status(r))}${verifyBadge(r)}${linkField(r,i,'menu','Menu URL')}<div class="verify-row"><label><input type="checkbox" data-mobile-enabled="${i}" ${mobileEnabled(r)?'checked':''}> Show Mobile Ordering</label><button data-test-mobile="${i}" ${ustate(generatedMobileUrl(r))!=='valid'?'disabled':''}>Test Mobile Order</button><span class="verify-note">Generated from Menu URL: ${esc(generatedMobileUrl(r)||'Add a Menu URL first')}</span></div>${linkField(r,i,'map','Map URL')}<div class="verify-row"><label>Last Verified</label><input type="date" data-verified="${i}" value="${esc(verified(r))}"><button data-today="${i}">Today</button><span class="verify-note">Use Today after testing this record's links.</span></div><p><label>Notes</label><textarea data-notes="${i}">${esc(get(r,'Notes','notes'))}</textarea></p></article>`).join('')||'<div class="panel">No records match this filter.</div>';bind()}
function bind(){document.querySelectorAll('[data-mobile-enabled]').forEach(e=>e.onchange=()=>{let r=ROWS[+e.dataset.mobileEnabled];r[mobileKey(r)]=e.checked;dashboard();render()});document.querySelectorAll('[data-test-mobile]').forEach(b=>b.onclick=()=>{let u=generatedMobileUrl(ROWS[+b.dataset.testMobile]);if(ustate(u)==='valid')window.open(u,'_blank','noopener')});document.querySelectorAll('[data-url]').forEach(e=>e.onchange=()=>{let r=ROWS[+e.dataset.i];r[key(r,e.dataset.url)]=e.value.trim();dashboard();render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{let u=url(ROWS[+b.dataset.i],b.dataset.open);if(ustate(u)==='valid')window.open(u,'_blank','noopener')});document.querySelectorAll('[data-verified]').forEach(e=>e.onchange=()=>{let r=ROWS[+e.dataset.verified];r[key(r,'verified')]=e.value;dashboard();render()});document.querySelectorAll('[data-today]').forEach(b=>b.onclick=()=>{let r=ROWS[+b.dataset.today],d=new Date(),today=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;r[key(r,'verified')]=today;dashboard();render()});document.querySelectorAll('[data-notes]').forEach(e=>e.onchange=()=>{let r=ROWS[+e.dataset.notes],k=Object.prototype.hasOwnProperty.call(r,'Notes')?'Notes':'notes';r[k]=e.value})}
function download(){let out=Array.isArray(ROOT)?ROWS:{...ROOT,[ROOT.locations?'locations':'restaurants']:ROWS},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='restaurants.json';a.click()}$('search').oninput=render;$('filter').onchange=render;$('download').onclick=download;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{$('filter').value=b.dataset.filter;render();scrollTo({top:document.querySelector('.sticky').offsetTop,behavior:'smooth'})});fetch('restaurants.json?'+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}).then(j=>{ROOT=j;ROWS=Array.isArray(j)?j:(j.locations||j.restaurants||[]);dashboard();render()}).catch(()=>$('cards').innerHTML='<div class="panel"><strong>Could not load restaurants.json.</strong><br>Place this page beside restaurants.json.</div>');
</script></body></html>
