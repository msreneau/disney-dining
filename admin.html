<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trip Configuration</title><style>body{font:16px Arial;background:#f4f7fb;color:#17233c;margin:0}main{max-width:950px;margin:auto;padding:18px}.card{background:#fff;padding:16px;border-radius:12px;margin:12px 0;box-shadow:0 2px 9px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}input,button{font:inherit;padding:10px;border:1px solid #ccd3df;border-radius:8px}button{cursor:pointer;background:#fff}.primary{background:#17233c;color:#fff}.person{display:flex;gap:8px;margin:8px 0;align-items:center}.person input[type=text]{flex:1}.muted{color:#657087}</style></head><body><main><h1>Trip Configuration Admin</h1><p class="muted">Control the active trip, app features, and traveler list.</p><section class="card"><h2>Trip</h2><input id="trip" style="width:100%" placeholder="Trip name"></section><section class="card"><h2>Features</h2><div id="features" class="grid"></div></section><section class="card"><h2>Participants</h2><p class="muted">Uncheck Active to retain someone for a future trip without showing them in this trip.</p><div id="people"></div><button id="add">+ Add Person</button></section><section class="card"><div class="grid"><button id="download" class="primary">Download config.json</button><label>Import config.json<input id="import" type="file" accept=".json,application/json"></label></div><p id="status" class="muted"></p></section></main><script>
const L={familyFavorites:'Family Favorites',wishlist:'Wishlist',signatureSnacks:'Signature Snacks',pinkDonutMode:'Pink Donut Mode',skylinerMode:'Skyliner Snacks',tripTracker:'Trip Tracker',stepTracker:'Daily Step Tracker',christmasMode:'Christmas Mode',transportationMode:'Transportation Filters'};let C={tripName:'Disney Trip',features:{},participants:[]},$=x=>document.getElementById(x),esc=x=>String(x).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));function render(){$('trip').value=C.tripName||'';$('features').innerHTML=Object.entries(L).map(([k,n])=>`<label><input type="checkbox" data-f="${k}" ${C.features[k]?'checked':''}> ${n}</label>`).join('');$('people').innerHTML=C.participants.map((p,i)=>{if(typeof p==='string')p=C.participants[i]={name:p,active:true};return`<div class="person"><label><input type="checkbox" data-a="${i}" ${p.active!==false?'checked':''}> Active</label><input type="text" data-n="${i}" value="${esc(p.name||'')}"><button data-d="${i}">Remove</button></div>`}).join('');document.querySelectorAll('[data-f]').forEach(e=>e.onchange=()=>C.features[e.dataset.f]=e.checked);document.querySelectorAll('[data-a]').forEach(e=>e.onchange=()=>C.participants[+e.dataset.a].active=e.checked);document.querySelectorAll('[data-n]').forEach(e=>e.oninput=()=>C.participants[+e.dataset.n].name=e.value);document.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>{C.participants.splice(+e.dataset.d,1);render()})}$('trip').oninput=()=>C.tripName=$('trip').value;$('add').onclick=()=>{C.participants.push({name:'',active:true});render()};$('download').onclick=()=>{C.tripName=$('trip').value.trim()||'Disney Trip';C.participants=C.participants.filter(x=>x.name.trim());let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(C,null,2)],{type:'application/json'}));a.download='config.json';a.click();$('status').textContent='Downloaded. Upload this config.json to GitHub and replace the existing file.'};$('import').onchange=e=>{let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{C=JSON.parse(r.result);C.features=C.features||{};C.participants=C.participants||[];render()}catch{$('status').textContent='Invalid JSON file.'}};if(f)r.readAsText(f)};fetch('config.json?'+Date.now()).then(r=>r.json()).then(c=>{C=c;C.features=C.features||{};C.participants=C.participants||[];render()}).catch(render);
</script></body></html>
