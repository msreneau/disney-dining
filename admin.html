<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disney Dining Admin</title><style>:root{--p:#4527a0;--p2:#6a1b9a;--bg:#f5f3fa;--m:#607d8b;--g:#ffb300}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#263238}header{background:linear-gradient(135deg,var(--p),var(--p2));color:white;text-align:center;padding:20px}h1{margin:0}.wrap{max-width:1200px;margin:auto;padding:14px}.toolbar{position:sticky;top:0;z-index:5;background:white;padding:12px;border-radius:12px;box-shadow:0 3px 15px #0002}.filters{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:8px}select,input,textarea,button{font:inherit}select,input[type=search]{width:100%;padding:10px;border:1px solid #d5dce3;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:800;color:white;background:#455a64;cursor:pointer}.download{background:#2e7d32}.reset{background:#c62828}.home{background:#1565c0;text-decoration:none}.status{color:var(--m);font-size:13px;margin-top:8px}.card{background:white;border-radius:13px;padding:14px;margin:10px 0;box-shadow:0 2px 9px #0001}.changed{outline:3px solid #ffcc80}.name{font-size:19px;font-weight:800}.item{font-size:16px;color:var(--p2);font-weight:750}.meta{color:var(--m);font-size:14px}.editor{display:grid;grid-template-columns:145px 145px 1fr;gap:12px;margin-top:12px}.label{display:block;font-weight:800;font-size:13px;margin-bottom:5px}.stars{display:flex}.star{border:0;background:transparent;font-size:29px;color:#cfd8dc;padding:0;cursor:pointer}.star.on{color:var(--g)}.familychecks{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;padding:10px;background:#f5f7fb;border-radius:9px}.member{background:white;border:1px solid #dbe4ec;border-radius:99px;padding:7px 10px;font-weight:700}.member input{width:18px;height:18px;vertical-align:middle}textarea{width:100%;min-height:72px;padding:9px;border:1px solid #d5dce3;border-radius:8px}.wish{display:flex;gap:7px;align-items:center}.wish input{width:21px;height:21px}@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.editor{grid-template-columns:1fr}.toolbar{position:static}}</style></head><body><header><h1>⚙️ Disney Dining Admin</h1><div>Ratings, family interest, Wishlist and notes</div></header><main class="wrap"><section class="toolbar"><div class="filters"><select id="park"><option value="">All Parks</option></select><select id="type"><option value="">QS & Snacks</option><option>QS</option><option>SNACK</option></select><input id="search" type="search" placeholder="Search location, item or land"><label><input id="changed" type="checkbox"> Changed only</label></div><div class="actions"><button class="btn download" id="download">⬇ Download Updated restaurants.json</button><button class="btn reset" id="reset">Undo All Changes</button><a class="btn home" href="index.html">Open Main App</a></div><div class="status" id="status">Loading…</div></section><div id="list"></div></main><script>const MEMBERS=['Mike','Tammy','Piper','Fred','Stacy','Evelyn'];let payload,original,dirty=new Set();const $=x=>document.getElementById(x),yes=v=>v===true||['yes','true','1','y'].includes(String(v??'').toLowerCase()),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){payload=await(await fetch('restaurants.json?v='+Date.now(),{cache:'no-store'})).json();payload.locations.forEach(r=>{r.People=r.People||{};MEMBERS.forEach(n=>r.People[n]=yes(r.People[n]??r[n]))});original=JSON.parse(JSON.stringify(payload));[...new Set(payload.locations.map(r=>r.Park))].sort().forEach(x=>$('park').add(new Option(x,x)));render()}function filtered(){let p=$('park').value,t=$('type').value,q=$('search').value.toLowerCase();return payload.locations.filter(r=>(!p||r.Park===p)&&(!t||r.Type===t)&&(!$('changed').checked||dirty.has(r.ID))&&(!q||[r.Location,r.Item,r.Land].join(' ').toLowerCase().includes(q)))}function render(){let a=filtered();$('status').textContent=`Showing ${a.length} of ${payload.locations.length} · ${dirty.size} changed`;$('list').innerHTML=a.map(card).join('');bind()}function card(r){let n=Number(r.Rating)||0;return `<article class="card ${dirty.has(r.ID)?'changed':''}" data-id="${esc(r.ID)}"><div class="name">${esc(r.Location)}</div>${r.Item?`<div class="item">${esc(r.Item)}</div>`:''}<div class="meta">${esc(r.Park)} · ${esc(r.Land)} · ${esc(r.Type)}</div><div class="familychecks"><strong class="label" style="width:100%">Who wants this location or item?</strong>${MEMBERS.map(x=>`<label class="member"><input type="checkbox" data-member="${x}" ${yes(r.People[x])?'checked':''}> ${x}</label>`).join('')}</div><div class="editor"><div><span class="label">Family rating</span><div class="stars">${[1,2,3,4,5].map(i=>`<button class="star ${i<=n?'on':''}" data-rate="${i}">★</button>`).join('')}</div></div><label><span class="label">Wishlist / Must Do</span><span class="wish"><input class="wishlist" type="checkbox" ${yes(r.Wishlist)?'checked':''}> Yes</span></label><label><span class="label">Family notes</span><textarea>${esc(r.Notes)}</textarea></label></div></article>`}function touch(id){dirty.add(id);render()}function bind(){document.querySelectorAll('.card').forEach(c=>{let r=payload.locations.find(x=>x.ID===c.dataset.id);c.querySelectorAll('[data-member]').forEach(x=>x.onchange=()=>{r.People[x.dataset.member]=x.checked;touch(r.ID)});c.querySelectorAll('[data-rate]').forEach(x=>x.onclick=()=>{r.Rating=Number(x.dataset.rate);touch(r.ID)});c.querySelector('.wishlist').onchange=x=>{r.Wishlist=x.target.checked?'Yes':'No';touch(r.ID)};c.querySelector('textarea').onchange=x=>{r.Notes=x.target.value.trim();touch(r.ID)}})}['park','type','changed'].forEach(x=>$(x).onchange=render);$('search').oninput=render;$('reset').onclick=()=>{if(confirm('Discard all changes?')){payload=JSON.parse(JSON.stringify(original));dirty.clear();render()}};$('download').onclick=()=>{let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='restaurants.json';a.click();URL.revokeObjectURL(a.href);$('status').textContent='Downloaded restaurants.json. Upload it to GitHub and replace the existing file.'};load().catch(()=>{$('status').textContent='Unable to load restaurants.json.'});</script></body></html>
