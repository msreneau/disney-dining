<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4527a0"><title>Disney Dining Admin</title><style>:root{--p:#4527a0;--p2:#6a1b9a;--bg:#f5f3fa;--text:#263238;--muted:#607d8b;--gold:#ffb300}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:20px;text-align:center}h1{margin:0 0 5px}.wrap{max-width:1200px;margin:auto;padding:14px}.toolbar{position:sticky;top:0;z-index:5;background:#fff;border-radius:12px;padding:12px;box-shadow:0 3px 15px #0002;margin-bottom:12px}.filters{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:8px}select,input,textarea,button{font:inherit}select,input[type=search]{width:100%;padding:10px;border:1px solid #d5dce3;border-radius:8px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:800;cursor:pointer;background:#455a64;color:#fff}.download{background:#2e7d32}.reset{background:#c62828}.home{background:#1565c0;text-decoration:none}.status{color:var(--muted);font-size:13px;margin-top:8px}.card{background:#fff;border-radius:13px;padding:14px;margin:10px 0;box-shadow:0 2px 9px #0001}.top{display:grid;grid-template-columns:1fr auto;gap:10px}.name{font-size:19px;font-weight:800}.item{font-size:16px;color:var(--p2);font-weight:750}.meta{color:var(--muted);font-size:14px;margin-top:4px}.editor{display:grid;grid-template-columns:160px 170px 1fr;gap:12px;margin-top:12px;align-items:start}.label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.stars{display:flex;gap:4px}.star{background:transparent;border:0;font-size:30px;color:#cfd8dc;padding:0;cursor:pointer}.star.on{color:var(--gold)}.wishbox{display:flex;align-items:center;gap:8px;padding-top:8px}.wishbox input{width:22px;height:22px}textarea{width:100%;min-height:76px;border:1px solid #d5dce3;border-radius:8px;padding:9px;resize:vertical}.changed{outline:3px solid #ffcc80}.empty{background:white;border-radius:12px;padding:30px;text-align:center;color:var(--muted)}@media(max-width:750px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.editor{grid-template-columns:1fr}.toolbar{position:static}}</style></head><body><header><h1>⚙️ Disney Dining Admin</h1><div>Family rating, wishlist and notes editor</div></header><main class="wrap"><section class="toolbar"><div class="filters"><select id="park"><option value="">All Parks</option></select><select id="type"><option value="">QS & Snacks</option><option>QS</option><option>SNACK</option></select><input id="search" type="search" placeholder="Search location, item or land"><label><input id="onlyChanged" type="checkbox"> Changed only</label></div><div class="actions"><button class="btn download" id="download">⬇ Download Updated restaurants.json</button><button class="btn reset" id="reset">Undo All Unsaved Changes</button><a class="btn home" href="index.html">Open Main App</a></div><div class="status" id="status">Loading restaurant data…</div></section><div id="list"></div></main><script>let payload,original,dirty=new Set();const $=x=>document.getElementById(x),yes=v=>String(v).toLowerCase()==='yes',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{payload=await (await fetch('restaurants.json?v='+Date.now(),{cache:'no-store'})).json();original=JSON.parse(JSON.stringify(payload));fillParks();render()}catch(e){$('status').textContent='Could not load restaurants.json. Confirm it is in the repository root.'}}function fillParks(){[...new Set(payload.locations.map(x=>x.Park))].sort().forEach(x=>$('park').add(new Option(x,x)))}function rows(){let p=$('park').value,t=$('type').value,q=$('search').value.toLowerCase();return payload.locations.filter(r=>(!p||r.Park===p)&&(!t||r.Type===t)&&(!$('onlyChanged').checked||dirty.has(r.ID))&&(!q||[r.Location,r.Item,r.Land].join(' ').toLowerCase().includes(q)))}function render(){let a=rows();$('status').textContent=`Showing ${a.length} of ${payload.locations.length} locations · ${dirty.size} changed`;$('list').innerHTML=a.length?a.map(card).join(''):'<div class="empty">No locations match these filters.</div>';bind()}function card(r){let n=Number(r.Rating)||0;return `<article class="card ${dirty.has(r.ID)?'changed':''}" data-id="${esc(r.ID)}"><div class="top"><div><div class="name">${esc(r.Location)}</div>${r.Item?`<div class="item">${esc(r.Item)}</div>`:''}<div class="meta">${esc(r.Park)} · ${esc(r.Land)} · ${esc(r.Type)}</div></div></div><div class="editor"><div><span class="label">Family rating</span><div class="stars">${[1,2,3,4,5].map(i=>`<button class="star ${i<=n?'on':''}" data-rate="${i}" aria-label="Rate ${i}">★</button>`).join('')}</div></div><label><span class="label">Wishlist / Must Do</span><span class="wishbox"><input class="wish" type="checkbox" ${yes(r.Wishlist)?'checked':''}> Yes, remember this</span></label><label><span class="label">Family notes</span><textarea class="notes" placeholder="What should we order? Who likes it? Best time to stop?">${esc(r.Notes)}</textarea></label></div></article>`}function mark(id){dirty.add(id);render()}function bind(){document.querySelectorAll('.card').forEach(c=>{let id=c.dataset.id,r=payload.locations.find(x=>x.ID===id);c.querySelectorAll('.star').forEach(b=>b.onclick=()=>{r.Rating=Number(b.dataset.rate);mark(id)});c.querySelector('.wish').onchange=e=>{r.Wishlist=e.target.checked?'Yes':'No';mark(id)};c.querySelector('.notes').onchange=e=>{r.Notes=e.target.value.trim();mark(id)}})}['park','type','onlyChanged'].forEach(x=>$(x).onchange=render);$('search').oninput=render;$('reset').onclick=()=>{if(confirm('Discard all changes made in this admin session?')){payload=JSON.parse(JSON.stringify(original));dirty.clear();render()}};$('download').onclick=()=>{let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='restaurants.json';a.click();URL.revokeObjectURL(a.href);$('status').textContent=`Downloaded restaurants.json with ${dirty.size} changes. Upload it to GitHub and replace the existing file.`};load();</script></body></html>
